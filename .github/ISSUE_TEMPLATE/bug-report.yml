name: Bug in the web version
description: Something breaks when playing in the browser (web build or streaming demo)
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Before you start: if the same thing happens in the official Unciv
        on desktop or Android, please report it [upstream](https://github.com/yairm210/Unciv/issues) instead.
        This repo only deals with what's specific to running the game in a browser.
  - type: checkboxes
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and didn't find this one
          required: true
  - type: dropdown
    id: build
    attributes:
      label: Which version were you playing?
      options:
        - Web build (the game runs in the page)
        - Streaming demo (Docker + noVNC)
        - Not sure
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and system
      placeholder: "Chrome 130 on Windows 11, Safari on iPad..."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or link
      description: The commit you built from, or the URL you played on.
      placeholder: "07330ca, or https://..."
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to get there
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Browser console
      description: |
        Open the developer tools (F12), go to the Console tab and paste what's red, or the crash screen text.
        That's usually the most useful part of the report.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, a save file, whether it happens every time...
